<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seu Roteiro Gastronômico</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://kit.fontawesome.com/0de9728a83.js" crossorigin="anonymous"></script>
    
    <link rel="icon" type="image/png" href="icone.png">
</head>
<body class="app-page">

    <div class="app-container">
        <header>
            <div class="logo">
                <i class="fa-solid fa-utensils"></i>
                <h1>Restaurantes com meu amorzão</h1>
            </div>
            <div class="header-actions">
                <button id="logout-button" title="Sair"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </header>

        <main>
            <details class="add-restaurant-section">
                <summary>
                    <h2><i class="fa-solid fa-plus"></i> Adicionar novo restaurante</h2>
                </summary>
                <form id="add-restaurant-form">
                    <input type="text" id="res-nome" placeholder="Nome do Restaurante" required>
                    <input type="text" id="res-cozinha" placeholder="Tipo de Cozinha">
                    <input type="text" id="res-preco" placeholder="Faixa de Preço (Ex: $$)">
                    <input type="text" id="res-localizacao" placeholder="Endereço ou Link do Maps">
                    <input type="url" id="res-instagram" placeholder="Link do Instagram">
                    <div class="checkbox-group">
                        <label><input type="checkbox" id="res-vr"> Aceita VR?</label>
                    </div>
                    <button type="submit">Adicionar à Lista</button>
                </form>
            </details>

            <div class="toolbar">
                <div class="search-wrapper">
                    <i class="fa-solid fa-search"></i>
                    <input type="search" id="search-input" placeholder="Buscar por nome...">
                </div>
                <div class="sort-wrapper">
                    <label for="sort-select">Organizar por:</label>
                    <select id="sort-select">
                        <option value="alfabetica">Ordem Alfabética</option>
                        <option value="cozinha">Tipo de Cozinha</option>
                        <option value="visitados">Visitados / Pendentes</option>
                    </select>
                </div>
            </div>
            
            <div id="restaurantes-lista">
                </div>
        </main>
    </div>

    <div id="gallery-modal-overlay" class="hidden">
        <div id="gallery-modal-content">
            <h2 id="gallery-restaurant-name">Fotos do Restaurante</h2>
            <div id="gallery-grid">
                </div>
            <hr>
            <h3>Adicionar Nova Foto</h3>
            <form id="upload-photo-form">
                <input type="file" id="photo-input" accept="image/*" required>
                <button type="submit">Enviar Foto</button>
                <p id="upload-status"></p>
            </form>
            <button id="close-gallery-modal-btn" class="close-btn">&times;</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
